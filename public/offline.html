<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#03040a" />
    <title>Offline · Udharwale</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ec;
        --surface: #fffcf7;
        --text: #14201c;
        --muted: #5f6f68;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        width: min(420px, 100%);
        background: var(--surface);
        border: 1px solid rgba(20, 32, 28, 0.1);
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: block;
        margin: 0 auto 14px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        background: var(--accent);
        color: white;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/udharwale-192.png" alt="Udharwale" width="56" height="56" />
      <div class="badge">Udharwale · Offline</div>
      <h1>You're offline</h1>
      <p>
        The installable app shell is available, but live ledgers need a connection.
        Reconnect and open Udharwale again to sync balances.
      </p>
      <p style="margin-top:16px;font-size:12px;font-weight:700;color:var(--accent);">
        Udharwale by Naeem Navjivan
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
